<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africon — My AI Sprint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0052CC 0%, #1a7a3f 100%);
      min-height: 100vh; padding: 20px 16px 40px;
    }
    .container { max-width:720px; margin:0 auto; }
    .header { text-align:center; color:white; margin-bottom:22px; }
    .brand-name { font-size:26px; font-weight:700; letter-spacing:2px; }
    .brand-sub { font-size:12px; color:#6FCF97; letter-spacing:1px; margin-top:2px; }
    .hello { font-size:22px; font-weight:700; margin-top:16px; }
    .hello-sub { font-size:13px; opacity:.85; margin-top:4px; }
    .card { background:white; border-radius:14px; box-shadow:0 8px 32px rgba(0,0,0,.15); margin-bottom:16px; overflow:hidden; }
    .sess-hd { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; user-select:none; }
    .sess-hd:hover { background:#fafbff; }
    .sess-icon { width:42px; height:42px; border-radius:10px; background:#e8f0ff; color:#0052CC; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .sess-info { flex:1; min-width:0; }
    .sess-title { font-weight:700; font-size:15px; color:#111; }
    .sess-meta { font-size:12px; color:#888; margin-top:2px; }
    .sess-chev { color:#aaa; transition:transform .2s; }
    .card.open .sess-chev { transform:rotate(180deg); }
    .tag { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
    .tag-today { background:#d4edda; color:#155724; }
    .tag-todo { background:#fff3cd; color:#856404; }
    .sess-body { display:none; padding:0 18px 18px; }
    .card.open .sess-body { display:block; }

    .block { border:1px solid #eef0f4; border-radius:12px; padding:16px; margin-top:12px; }
    .block-hd { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .num { width:24px; height:24px; border-radius:50%; background:#0052CC; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .block-title { font-weight:700; font-size:14px; color:#222; }
    .block-text { font-size:13px; color:#666; line-height:1.6; margin-bottom:12px; }
    .warn { background:#fff8e6; border:1px solid #ffe2a3; color:#7a5300; border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5; margin-bottom:12px; }
    .warn i { margin-right:4px; }
    .done { background:#e9f7ee; border-color:#b9e4c7; color:#1a6b38; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; transition:background .15s; }
    .btn-blue { background:#0052CC; color:#fff; } .btn-blue:hover { background:#003d99; }
    .btn-green { background:#1a7a3f; color:#fff; } .btn-green:hover { background:#14612f; }
    .btn-full { width:100%; }
    .muted { font-size:12.5px; color:#aaa; font-style:italic; }

    .res { border-top:1px solid #f0f0f0; padding:12px 0; }
    .res:first-of-type { border-top:none; padding-top:4px; }
    .res-hd { display:flex; align-items:center; gap:8px; }
    .res-hd i { color:#0052CC; width:16px; text-align:center; }
    .res-title { font-weight:600; font-size:13.5px; color:#333; flex:1; min-width:0; word-break:break-word; }
    .res-note { font-size:12.5px; color:#777; margin:6px 0 0 24px; line-height:1.5; white-space:pre-wrap; }
    .prompt { position:relative; background:#f6f8fb; border:1px solid #e3e8ef; border-radius:8px; padding:12px 12px 12px; margin:8px 0 0; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; line-height:1.55; color:#222; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto; }
    .copy { background:#eef3ff; color:#0052CC; border:none; border-radius:6px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; }
    .copy:hover { background:#dce7ff; }
    .res-img { display:block; max-width:100%; border-radius:8px; margin:8px 0 0; border:1px solid #eee; }
    .res-link { font-size:12px; color:#0052CC; text-decoration:none; font-weight:600; flex-shrink:0; }

    .state { text-align:center; padding:48px 20px; color:#888; font-size:14px; line-height:1.6; }
    .state i { font-size:30px; display:block; margin-bottom:12px; }
    .section-lbl { color:rgba(255,255,255,.85); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin:22px 4px 10px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:white; padding:10px 20px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; }
    .toast.show { opacity:1; }
    .foot { color:rgba(255,255,255,.65); font-size:11px; text-align:center; margin-top:18px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand-name">AFRICON</div>
      <div class="brand-sub">AI SPRINTS</div>
      <div class="hello" id="hello">Loading…</div>
      <div class="hello-sub" id="hello-sub"></div>
    </div>

    <div id="content">
      <div class="card"><div class="state"><i class="fas fa-spinner fa-spin"></i>Loading your Sprint page…</div></div>
    </div>

    <p class="foot">Bookmark this page — it holds the materials for every Sprint you attend.</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params = new URLSearchParams(location.search);
    let token = params.get('t');
    try {
      if (token) localStorage.setItem('africon_portal', token);
      else token = localStorage.getItem('africon_portal');
    } catch {}
    let data = null;

    async function init() {
      if (!token) return showLogin();
      try {
        const r = await fetch('/api/sprint?action=portal&t=' + encodeURIComponent(token));
        const body = await r.json().catch(() => ({}));
        if (r.status === 401 || r.status === 404) return showLogin('Your session has expired. Sign in again to see your page.');
        if (!r.ok) return fail(body.error || 'Could not load your Sprint page.');
        data = body;
        render();
      } catch {
        fail('Network error. Please refresh the page.');
      }
    }

    let loginMethod = 'phone';

    function showLogin(note) {
      try { localStorage.removeItem('africon_portal'); } catch {}
      document.getElementById('hello').textContent = 'AI Sprints';
      document.getElementById('hello-sub').textContent = 'Open your participant page';
      document.getElementById('content').innerHTML = `<div class="card" style="padding:24px">
        ${note ? `<p style="font-size:13px;color:#b45309;margin:0 0 14px">${esc(note)}</p>` : ''}
        <p style="font-size:14px;color:#444;margin:0 0 14px">Already checked in? Enter the phone number or email you registered with.</p>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-full" id="lm-phone" onclick="setLoginMethod('phone')"><i class="fas fa-phone"></i> Phone</button>
          <button class="btn btn-full" id="lm-email" onclick="setLoginMethod('email')"><i class="fas fa-envelope"></i> Email</button>
        </div>
        <input id="login-input" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;box-sizing:border-box"
               onkeydown="if(event.key==='Enter')submitLogin()">
        <div id="login-error" style="color:#dc3545;font-size:13px;min-height:18px;margin:8px 0"></div>
        <button class="btn btn-blue btn-full" id="login-btn" onclick="submitLogin()"><i class="fas fa-arrow-right"></i> Open my page</button>
      </div>`;
      setLoginMethod(loginMethod);
    }

    function setLoginMethod(m) {
      loginMethod = m;
      const isPhone = m === 'phone';
      document.getElementById('lm-phone').className = 'btn btn-full ' + (isPhone ? 'btn-blue' : '');
      document.getElementById('lm-email').className = 'btn btn-full ' + (isPhone ? '' : 'btn-blue');
      const inp = document.getElementById('login-input');
      inp.type = isPhone ? 'tel' : 'email';
      inp.placeholder = isPhone ? 'e.g. 0244123456' : 'e.g. you@email.com';
      inp.focus();
    }

    async function submitLogin() {
      const value = document.getElementById('login-input').value.trim();
      const err = document.getElementById('login-error');
      if (!value) { err.textContent = loginMethod === 'phone' ? 'Please enter your phone number.' : 'Please enter your email address.'; return; }
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking…';
      try {
        const r = await fetch('/api/sprint?action=login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: loginMethod, contact: value }),
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) { err.textContent = body.error || 'Something went wrong. Please try again.'; return; }
        token = body.portal_token;
        try { localStorage.setItem('africon_portal', token); } catch {}
        history.replaceState(null, '', '/sprint.html?t=' + encodeURIComponent(token));
        init();
      } catch {
        err.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right"></i> Open my page';
      }
    }

    function fail(msg) {
      document.getElementById('hello').textContent = 'AI Sprints';
      document.getElementById('content').innerHTML =
        `<div class="card"><div class="state"><i class="fas fa-exclamation-triangle" style="color:#dc3545"></i>${esc(msg)}</div></div>`;
    }

    function render() {
      const first = data.name.split(' ')[0];
      document.getElementById('hello').textContent = `Welcome, ${first}!`;
      const n = data.sessions.length;
      document.getElementById('hello-sub').textContent =
        n > 1 ? `You have attended ${n} AI Sprints` : 'Your AI Sprint materials are below';
      document.title = `${data.name} — AI Sprints`;

      const current = data.sessions.find(s => s.attendee_id === data.current_attendee_id);
      const others  = data.sessions.filter(s => s !== current);

      let html = sessionCard(current, true);
      if (others.length) {
        html += `<div class="section-lbl">My other Sprints</div>`;
        html += others.map(s => sessionCard(s, false)).join('');
      }
      document.getElementById('content').innerHTML = html;
    }

    function sessionCard(s, open) {
      const t = s; // content is per session (date)
      const isToday = s.date === new Date().toLocaleDateString('en-CA');
      const tags = (isToday ? '<span class="tag tag-today">Today</span>' : '') +
                   (t.assessment_url && !s.assessment_opened ? '<span class="tag tag-todo">Assessment due</span>' : '');
      const mode = s.mode === 'online' ? 'Online' : s.mode === 'virtual' ? 'Virtual' : 'In-person + Virtual';

      return `<div class="card ${open ? 'open' : ''}" id="sess-${s.attendee_id}">
        <div class="sess-hd" onclick="this.parentElement.classList.toggle('open')">
          <div class="sess-icon"><i class="fas fa-bolt"></i></div>
          <div class="sess-info">
            <div class="sess-title">${esc(t.title)}${tags}</div>
            <div class="sess-meta">${fmtDate(s.date)}${t.time_label ? ' · ' + esc(t.time_label) : ''} · ${mode}</div>
          </div>
          <i class="fas fa-chevron-down sess-chev"></i>
        </div>
        <div class="sess-body">
          ${assessmentBlock(s, t)}
          ${resourcesBlock(t)}
          ${playbookBlock(t)}
        </div>
      </div>`;
    }

    function assessmentBlock(s, t) {
      let inner;
      if (!t.assessment_url) {
        inner = `<p class="muted">The post-assessment link will appear here once your facilitator shares it.</p>`;
      } else {
        inner = `
          <div class="warn ${s.assessment_opened ? 'done' : ''}" id="aw-${s.attendee_id}">
            ${s.assessment_opened
              ? '<i class="fas fa-check-circle"></i> You have opened the assessment. Make sure you submitted the form — certificates are only sent to participants who complete it.'
              : '<i class="fas fa-certificate"></i> <strong>Required for your certificate.</strong> Certificates are only sent to participants who complete this assessment.'}
          </div>
          <a class="btn btn-blue btn-full" href="${attr(t.assessment_url)}" target="_blank" rel="noopener"
             onclick="openedAssessment(${s.attendee_id})">
            <i class="fas fa-clipboard-check"></i> ${s.assessment_opened ? 'Open assessment again' : 'Take the post-assessment'}
          </a>`;
      }
      return `<div class="block">
        <div class="block-hd"><div class="num">1</div><div class="block-title">Post-assessment</div></div>
        ${inner}
      </div>`;
    }

    function resourcesBlock(t) {
      const list = t.resources || [];
      const inner = list.length
        ? list.map(resourceItem).join('')
        : `<p class="muted">Your facilitator hasn't shared prompts or assets for this Sprint yet.</p>`;
      return `<div class="block">
        <div class="block-hd"><div class="num">2</div><div class="block-title">Prompts &amp; assets</div></div>
        ${inner}
      </div>`;
    }

    function resourceItem(r) {
      const note = r.body && r.kind !== 'prompt' ? `<div class="res-note">${esc(r.body)}</div>` : '';
      if (r.kind === 'prompt') {
        return `<div class="res">
          <div class="res-hd"><i class="fas fa-terminal"></i><div class="res-title">${esc(r.title)}</div>
            <button class="copy" onclick="copyPrompt(${r.id}, this)"><i class="fas fa-copy"></i> Copy</button></div>
          <div class="prompt" id="p-${r.id}">${esc(r.body || '')}</div>
        </div>`;
      }
      if (r.kind === 'link') {
        return `<div class="res">
          <div class="res-hd"><i class="fas fa-link"></i><div class="res-title">${esc(r.title)}</div>
            <a class="res-link" href="${attr(r.url)}" target="_blank" rel="noopener">Open <i class="fas fa-external-link-alt"></i></a></div>
          ${note}
        </div>`;
      }
      const src = `/api/sprint?action=file&id=${r.id}&t=${encodeURIComponent(token)}`;
      const isImg = /^image\//.test(r.file_mime || '');
      const isVid = /^video\//.test(r.file_mime || '');
      return `<div class="res">
        <div class="res-hd"><i class="fas ${isImg ? 'fa-image' : isVid ? 'fa-film' : 'fa-file-alt'}"></i>
          <div class="res-title">${esc(r.title)}</div>
          <a class="res-link" href="${src}&download=1"><i class="fas fa-download"></i> ${fmtSize(r.file_size)}</a></div>
        ${note}
        ${isImg ? `<img class="res-img" src="${src}" alt="${attr(r.title)}" loading="lazy">` : ''}
        ${isVid ? `<video class="res-img" src="${src}" controls preload="metadata"></video>` : ''}
      </div>`;
    }

    function playbookBlock(t) {
      const inner = t.playbook_url
        ? `<p class="block-text">Your step-by-step guide to keep practising after the Sprint.</p>
           <a class="btn btn-green btn-full" href="${attr(t.playbook_url)}" target="_blank" rel="noopener">
             <i class="fas fa-book-open"></i> Open the Playbook</a>`
        : `<p class="muted">The Playbook link will appear here once your facilitator shares it.</p>`;
      return `<div class="block">
        <div class="block-hd"><div class="num">3</div><div class="block-title">Playbook</div></div>
        ${inner}
      </div>`;
    }

    function openedAssessment(attendeeId) {
      // Fire-and-forget: the link still opens even if this fails
      fetch('/api/sprint?action=assessment&t=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendee_id: attendeeId }),
        keepalive: true,
      }).catch(() => {});
      const s = data.sessions.find(x => x.attendee_id === attendeeId);
      if (s && !s.assessment_opened) {
        s.assessment_opened = true;
        setTimeout(() => { render(); document.getElementById('sess-' + attendeeId).classList.add('open'); }, 300);
      }
    }

    async function copyPrompt(id, btn) {
      const text = document.getElementById('p-' + id).textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.innerHTML = '<i class="fas fa-check"></i> Copied';
      setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i> Copy'; }, 1800);
    }

    function fmtDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    }
    function fmtSize(n) {
      if (!n) return '';
      return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function attr(s) {
      const v = String(s || '');
      return /^https?:\/\//i.test(v) || v.startsWith('/') ? esc(v) : '#';
    }

    init();
  </script>
</body>
</html>
