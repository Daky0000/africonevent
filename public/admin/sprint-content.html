<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Africon Admin — Sprint Content</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
    nav{background:#0052CC;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
    .nav-brand{font-size:18px;font-weight:700;letter-spacing:2px}
    .nav-brand span{color:#6FCF97;font-size:11px;display:block;letter-spacing:1px;font-weight:400}
    .nav-back{color:#fff;text-decoration:none;font-size:13px;opacity:.9}
    .nav-back:hover{opacity:1}
    .main{max-width:900px;margin:0 auto;padding:28px 20px}
    h1{font-size:22px;color:#222}
    .sub{font-size:13px;color:#888;margin:4px 0 22px}
    .card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px}
    .card-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee}
    .card-hd h3{font-size:15px;color:#333;font-weight:600}
    .card-body{padding:20px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;margin-bottom:5px}
    .hint{font-size:11.5px;color:#999;margin-top:4px}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
    textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.5}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#0052CC;box-shadow:0 0 0 3px rgba(0,82,204,.1)}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
    .btn-blue{background:#0052CC;color:#fff}.btn-blue:hover{background:#003d99}
    .btn-blue:disabled{background:#999;cursor:not-allowed}
    .kinds{display:flex;gap:6px;margin-bottom:16px}
    .kind{flex:1;padding:10px;border:2px solid #e2e6ee;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#555;font-family:inherit}
    .kind.active{border-color:#0052CC;color:#0052CC;background:#f5f8ff}
    .res{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid #f0f0f0;align-items:flex-start}
    .res:last-child{border-bottom:none}
    .res-icon{width:34px;height:34px;border-radius:8px;background:#eef3ff;color:#0052CC;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .res-main{flex:1;min-width:0}
    .res-title{font-weight:600;font-size:13.5px;color:#222}
    .res-detail{font-size:12px;color:#888;margin-top:3px;white-space:pre-wrap;word-break:break-word;max-height:90px;overflow:hidden}
    .res-detail a{color:#0052CC}
    .res-img{max-width:200px;max-height:120px;border-radius:6px;margin-top:6px;border:1px solid #eee;display:block}
    .del{background:none;border:none;color:#c0392b;cursor:pointer;font-size:14px;padding:6px}
    .del:hover{color:#8e1d12}
    .edit{background:none;border:none;color:#0052CC;cursor:pointer;font-size:14px;padding:6px}
    .edit:hover{color:#003d99}
    .res-edit{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .res-edit input,.res-edit textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
    .res-edit textarea{min-height:110px;resize:vertical}
    .res-edit-actions{display:flex;gap:8px;justify-content:flex-end}
    .btn-ghost{background:#fff;color:#444;border:1px solid #ddd}
    .empty{text-align:center;padding:28px;color:#aaa;font-size:13px}
    .datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .datebar input{width:auto}
    .nav-btn{background:#fff;border:1px solid #ddd;border-radius:6px;padding:9px 12px;cursor:pointer;color:#333}
    .nav-btn:hover{border-color:#0052CC;color:#0052CC}
    .nav-btn:disabled{opacity:.4;cursor:not-allowed}
    .sess-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:22px}
    .sess-tab{background:#fff;border:2px solid #e2e6ee;border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit}
    .sess-tab:hover{border-color:#9db8e8}
    .sess-tab.active{border-color:#0052CC;background:#f5f8ff}
    .sess-tab-title{font-weight:700;font-size:13px;color:#222}
    .sess-tab-meta{font-size:11.5px;color:#888;margin-top:3px}
    .flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
    .flag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
    .flag-ok{background:#d4edda;color:#155724}
    .flag-miss{background:#fde8e8;color:#9b1c1c}
    .flag-info{background:#eef3ff;color:#0052CC}
    .no-sess{background:#fff;border-radius:8px;padding:28px;text-align:center;color:#999;font-size:13px;margin-bottom:22px}
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;color:#fff;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;max-width:90%}
    #toast.show{opacity:1}
    #toast.success{background:#1a7a3f}
    #toast.error{background:#c0392b}
  </style>
</head>
<body>
<nav>
  <div class="nav-brand">AFRICON <span>AI SPRINTS</span></div>
  <a href="/admin/dashboard.html#sprint" class="nav-back"><i class="fas fa-arrow-left"></i> Back to AI Sprint</a>
</nav>

<div class="main">
  <div class="datebar">
    <button class="nav-btn" id="prev-day" onclick="stepDay(-1)" title="Previous Sprint day"><i class="fas fa-chevron-left"></i></button>
    <input type="date" id="day" onchange="pickDate(this.value)">
    <button class="nav-btn" id="next-day" onclick="stepDay(1)" title="Next Sprint day"><i class="fas fa-chevron-right"></i></button>
    <button class="nav-btn" onclick="pickDate(new Date().toLocaleDateString('en-CA'))">Today</button>
  </div>
  <div id="sess-tabs"></div>

  <div id="editor" style="display:none">
  <h1 id="title">Loading…</h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="card-hd"><h3><i class="fas fa-link" style="color:#0052CC;margin-right:6px"></i>Assessment &amp; Playbook</h3></div>
    <div class="card-body">
      <div class="field">
        <label>1. Post-assessment link</label>
        <input id="assessment" placeholder="https://forms.gle/…">
        <div class="hint">Participants are told their certificate is only sent once they complete this.</div>
      </div>
      <div class="field">
        <label>3. Playbook link</label>
        <input id="playbook" placeholder="https://…">
      </div>
      <button class="btn btn-blue" id="save-links" onclick="saveLinks()"><i class="fas fa-save"></i> Save links</button>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h3><i class="fas fa-plus-circle" style="color:#0052CC;margin-right:6px"></i>2. Add prompt or asset</h3></div>
    <div class="card-body">
      <div class="kinds">
        <button class="kind active" data-kind="prompt" onclick="setKind('prompt')"><i class="fas fa-terminal"></i> Prompt</button>
        <button class="kind" data-kind="link" onclick="setKind('link')"><i class="fas fa-link"></i> Link</button>
        <button class="kind" data-kind="file" onclick="setKind('file')"><i class="fas fa-upload"></i> File / Media</button>
      </div>
      <div class="field">
        <label>Title *</label>
        <input id="r-title" placeholder="e.g. SCRIBE starter prompt">
      </div>
      <div class="field" id="f-url" style="display:none">
        <label>URL *</label>
        <input id="r-url" placeholder="https://drive.google.com/… or a video link">
      </div>
      <div class="field" id="f-file" style="display:none">
        <label>File * <span style="text-transform:none;font-weight:400;color:#999">(max 3 MB — use a link for bigger files)</span></label>
        <input id="r-file" type="file">
      </div>
      <div class="field">
        <label id="body-label">Prompt text *</label>
        <textarea id="r-body" placeholder="Paste the prompt participants should copy…"></textarea>
      </div>
      <button class="btn btn-blue" id="add-btn" onclick="addResource()"><i class="fas fa-plus"></i> Add</button>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h3><i class="fas fa-folder-open" style="color:#0052CC;margin-right:6px"></i>Shared with participants <span id="r-count" style="font-size:12px;color:#999;font-weight:400"></span></h3></div>
    <div id="r-list"><div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
  </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.replace('/admin/login.html');
  const H = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token };
  const qs = new URLSearchParams(location.search);
  let kind = 'prompt';
  let track = null;      // the selected session and its content
  let sessions = [];     // every Sprint session, for the date navigator
  let dates = [];        // distinct Sprint dates, sorted
  let currentDate = null;

  async function init() {
    const r = await fetch('/api/sprint?action=sessions', { headers: H });
    if (r.status === 401) { window.location.replace('/admin/login.html'); return; }
    sessions = await r.json();
    dates = [...new Set(sessions.map(s => s.date))].sort();

    const wanted = sessions.find(s => String(s.id) === qs.get('id'));
    if (wanted) { pickDate(wanted.date, wanted.id); return; }
    const today = new Date().toLocaleDateString('en-CA');
    pickDate(qs.get('date') || dates.find(d => d >= today) || dates[dates.length - 1]);
  }

  function stepDay(dir) {
    const i = dates.indexOf(currentDate);
    let next;
    if (i !== -1) next = dates[i + dir];
    else next = dir > 0 ? dates.find(d => d > currentDate) : [...dates].reverse().find(d => d < currentDate);
    if (next) pickDate(next);
  }

  function pickDate(date, sessionId) {
    currentDate = date;
    document.getElementById('day').value = date;
    document.getElementById('prev-day').disabled = !dates.some(d => d < date);
    document.getElementById('next-day').disabled = !dates.some(d => d > date);
    const day = sessions.filter(s => s.date === date);
    renderTabs(day, sessionId);
    if (!day.length) {
      document.getElementById('editor').style.display = 'none';
      history.replaceState(null, '', '?date=' + date);
      return;
    }
    loadSession(sessionId || day[0].id);
  }

  function renderTabs(day, activeId) {
    const el = document.getElementById('sess-tabs');
    if (!day.length) {
      el.innerHTML = `<div class="no-sess"><i class="fas fa-calendar-times"></i> No Sprint sessions on ${longDate(currentDate)}. Use the arrows to jump to the nearest Sprint day.</div>`;
      return;
    }
    el.innerHTML = '<div class="sess-tabs">' + day.map(s => `
      <button class="sess-tab ${s.id === activeId ? 'active' : ''}" data-id="${s.id}" onclick="loadSession(${s.id})">
        <div class="sess-tab-title">${esc(s.track_title || s.name)}</div>
        <div class="sess-tab-meta">${esc(s.time_label || '')} · Week ${s.week_no}</div>
        <div class="flags">
          <span class="flag ${s.assessment_url ? 'flag-ok' : 'flag-miss'}">${s.assessment_url ? '✓' : '✗'} Assessment</span>
          <span class="flag ${s.playbook_url ? 'flag-ok' : 'flag-miss'}">${s.playbook_url ? '✓' : '✗'} Playbook</span>
          <span class="flag flag-info">${s.resource_count} asset${s.resource_count === 1 ? '' : 's'}</span>
        </div>
      </button>`).join('') + '</div>';
  }

  async function loadSession(id) {
    document.querySelectorAll('.sess-tab').forEach(b => b.classList.toggle('active', b.dataset.id === String(id)));
    history.replaceState(null, '', '?id=' + id);
    const r = await fetch('/api/sprint?action=session&id=' + id, { headers: H });
    if (!r.ok) { toast('Could not load session', 'error'); return; }
    track = await r.json();
    const facil = track.delivery_mode === 'online'
      ? `Online: ${track.facilitator_virtual || '—'}${track.facilitator_support ? ' + ' + track.facilitator_support : ''}`
      : `In-person: ${track.facilitator_in_person || 'N/A'} · Virtual: ${track.facilitator_virtual || '—'}`;
    document.getElementById('title').textContent = track.track_title || track.name;
    document.getElementById('sub').textContent =
      `${longDate(track.date)} · ${track.time_label || ''} · ${facil} · Code ${track.access_code}. ` +
      `Shown only to participants of this session after they check in.`;
    document.title = (track.track_title || track.name) + ' — ' + track.date;
    document.getElementById('assessment').value = track.assessment_url || '';
    document.getElementById('playbook').value = track.playbook_url || '';
    document.getElementById('editor').style.display = 'block';
    renderResources();
  }

  // Keep the date tabs' content flags in step with edits
  function syncTab() {
    const s = sessions.find(x => x.id === track.id);
    if (!s) return;
    s.assessment_url = track.assessment_url;
    s.playbook_url = track.playbook_url;
    s.resource_count = track.resources.length;
    renderTabs(sessions.filter(x => x.date === currentDate), track.id);
  }

  function longDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }

  function renderResources() {
    const list = track.resources;
    document.getElementById('r-count').textContent = `(${list.length})`;
    const el = document.getElementById('r-list');
    if (!list.length) { el.innerHTML = '<div class="empty">Nothing shared yet. Add a prompt, link or file above.</div>'; return; }
    el.innerHTML = list.map(r => {
      const icon = { prompt: 'fa-terminal', link: 'fa-link', file: 'fa-file-alt' }[r.kind];
      if (r.id === editingId) return `<div class="res">
        <div class="res-icon"><i class="fas ${icon}"></i></div>
        <div class="res-edit">
          <input id="e-title" value="${esc(r.title)}" placeholder="Title">
          ${r.kind === 'link' ? `<input id="e-url" value="${esc(r.url)}" placeholder="https://…">` : ''}
          <textarea id="e-body" placeholder="${r.kind === 'prompt' ? 'Prompt text' : 'Note (optional)'}">${esc(r.body || '')}</textarea>
          <div class="res-edit-actions">
            <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
            <button class="btn btn-blue" id="e-save" onclick="saveEdit(${r.id})"><i class="fas fa-check"></i> Save</button>
          </div>
        </div>
      </div>`;
      const fileUrl = `/api/sprint?action=file&id=${r.id}&t=${encodeURIComponent(token)}`;
      let detail = '';
      if (r.kind === 'prompt') detail = esc(r.body || '');
      if (r.kind === 'link') detail = `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>` + (r.body ? '\n' + esc(r.body) : '');
      if (r.kind === 'file') detail = `<a href="${fileUrl}" target="_blank">${esc(r.file_name)}</a> · ${fmtSize(r.file_size)}` + (r.body ? '\n' + esc(r.body) : '');
      const img = r.kind === 'file' && /^image\//.test(r.file_mime || '') ? `<img class="res-img" src="${fileUrl}" alt="">` : '';
      return `<div class="res">
        <div class="res-icon"><i class="fas ${icon}"></i></div>
        <div class="res-main"><div class="res-title">${esc(r.title)}</div><div class="res-detail">${detail}</div>${img}</div>
        <button class="edit" title="Edit" onclick="startEdit(${r.id})"><i class="fas fa-pen"></i></button>
        <button class="del" title="Delete" onclick="delResource(${r.id})"><i class="fas fa-trash"></i></button>
      </div>`;
    }).join('');
  }

  function setKind(k) {
    kind = k;
    document.querySelectorAll('.kind').forEach(b => b.classList.toggle('active', b.dataset.kind === k));
    document.getElementById('f-url').style.display = k === 'link' ? 'block' : 'none';
    document.getElementById('f-file').style.display = k === 'file' ? 'block' : 'none';
    document.getElementById('body-label').innerHTML = k === 'prompt'
      ? 'Prompt text *'
      : 'Note <span style="text-transform:none;font-weight:400;color:#999">(optional)</span>';
    document.getElementById('r-body').placeholder = k === 'prompt'
      ? 'Paste the prompt participants should copy…'
      : 'Short description shown under the item';
  }

  async function saveLinks() {
    const btn = document.getElementById('save-links');
    btn.disabled = true;
    try {
      const r = await fetch('/api/sprint?action=session&id=' + track.id, {
        method: 'PATCH', headers: H,
        body: JSON.stringify({
          assessment_url: document.getElementById('assessment').value,
          playbook_url: document.getElementById('playbook').value,
        }),
      });
      const d = await r.json();
      if (!r.ok) return toast(d.error || 'Failed to save', 'error');
      document.getElementById('assessment').value = d.assessment_url || '';
      document.getElementById('playbook').value = d.playbook_url || '';
      track.assessment_url = d.assessment_url; track.playbook_url = d.playbook_url;
      syncTab();
      toast('Links saved', 'success');
    } catch { toast('Network error', 'error'); }
    finally { btn.disabled = false; }
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  async function addResource() {
    const title = document.getElementById('r-title').value.trim();
    const body = document.getElementById('r-body').value;
    const url = document.getElementById('r-url').value.trim();
    const fileInput = document.getElementById('r-file');
    if (!title) return toast('Please enter a title', 'error');
    if (kind === 'prompt' && !body.trim()) return toast('Please paste the prompt text', 'error');
    if (kind === 'link' && !url) return toast('Please enter the link', 'error');

    const payload = { event_id: track.id, kind, title, body, url };
    if (kind === 'file') {
      const f = fileInput.files[0];
      if (!f) return toast('Please choose a file', 'error');
      if (f.size > 3 * 1024 * 1024) return toast('File is larger than 3 MB — add it as a link instead', 'error');
      payload.file_name = f.name;
      payload.file_mime = f.type || 'application/octet-stream';
      payload.file_base64 = await readFile(f);
    }

    const btn = document.getElementById('add-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding…';
    try {
      const r = await fetch('/api/sprint?action=resource', { method: 'POST', headers: H, body: JSON.stringify(payload) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) return toast(d.error || 'Failed to add', 'error');
      track.resources.push(d);
      renderResources();
      syncTab();
      ['r-title', 'r-body', 'r-url'].forEach(id => document.getElementById(id).value = '');
      fileInput.value = '';
      toast('Added', 'success');
    } catch { toast('Network error', 'error'); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus"></i> Add'; }
  }

  let editingId = null;

  function startEdit(id) {
    editingId = id;
    renderResources();
    const t = document.getElementById('e-body');
    if (t) t.focus();
  }

  function cancelEdit() {
    editingId = null;
    renderResources();
  }

  async function saveEdit(id) {
    const r0 = track.resources.find(x => x.id === id);
    const title = document.getElementById('e-title').value.trim();
    const body = document.getElementById('e-body').value;
    const urlEl = document.getElementById('e-url');
    const url = urlEl ? urlEl.value.trim() : undefined;
    if (!title) return toast('Please enter a title', 'error');
    if (r0.kind === 'prompt' && !body.trim()) return toast('Prompt text cannot be empty', 'error');
    if (r0.kind === 'link' && !url) return toast('Please enter the link', 'error');

    const btn = document.getElementById('e-save');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
    try {
      const r = await fetch('/api/sprint?action=resource&id=' + id, {
        method: 'PATCH', headers: H, body: JSON.stringify({ title, body, url }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { toast(d.error || 'Failed to save', 'error'); return; }
      track.resources = track.resources.map(x => x.id === id ? d : x);
      editingId = null;
      renderResources();
      toast('Saved', 'success');
    } catch { toast('Network error', 'error'); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Save'; } }
  }

  async function delResource(id) {
    if (!confirm('Remove this item from the participant page?')) return;
    const r = await fetch('/api/sprint?action=resource&id=' + id, { method: 'DELETE', headers: H });
    if (!r.ok) return toast('Failed to delete', 'error');
    track.resources = track.resources.filter(x => x.id !== id);
    renderResources();
    syncTab();
    toast('Removed', 'success');
  }

  let toastTimer;
  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, type === 'error' ? 5000 : 3000);
  }
  function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  init();
</script>
</body>
</html>
